name: AliExpress Price Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aliexpress-price-tracker
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restaurer le dernier état sauvegardé
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: price-tracker.yml
          workflow_conclusion: success
          branch: ${{ github.event.repository.default_branch }}
          name: price-state
          path: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          if_no_artifact_found: warn
          check_artifacts: true
          search_artifacts: true

      - name: Vérifier les prix
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python price_tracker.py

      - name: Sauvegarder le dernier état
        uses: actions/upload-artifact@v4
        with:
          name: price-state
          path: state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
